name: "🐛 Bug"
description: Something crashes, the panel misbehaves, a meme pastes wrong or a GIF loses its animation.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what went wrong. Screenshots or a screen recording help a lot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: App you pasted into
      description: Only if it is about copying and pasting.
      placeholder: "e.g. Slack desktop 4.41, Discord in Safari, Telegram"
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "e.g. macOS 15.1, MacBook Air M2"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ReactionDeck version
      description: From the release you downloaded, or the commit you built.
