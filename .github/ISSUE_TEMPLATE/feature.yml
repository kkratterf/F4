name: "💡 Idea"
description: A feature for the panel, the search, the meme folder or the settings.
labels: ["app"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing
      description: What you want to do that F4 does not let you do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work.
    validations:
      required: true
