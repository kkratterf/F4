name: Release

# Started by hand with the version to publish (e.g. 0.1.0).
# The version must already be set in Resources/Info.plist (CFBundleShortVersionString):
# merge a `chore(release): vX.Y.Z` PR first.
#
# Tests, builds the ad-hoc signed F4.app, and publishes F4-<version>.zip,
# F4-<version>.dmg and SHA256SUMS.txt on a new vX.Y.Z tag, with release notes
# grouped by PR label (.github/release.yml), then (for stable releases) bumps
# version and sha256 in Casks/f4.rb on main.
#
# Dry run (dry_run: true): runs the whole pipeline but creates no tag or
# release and pushes nothing to main; the zip, the DMG, the checksums, the
# notes, appcast.xml, the cask and their diffs are uploaded as the
# "f4-<version>-dry-run" artifact and the notes are shown in the job summary.
#
# Auto-update with Sparkle (optional). When the SPARKLE_ED_PRIVATE_KEY secret
# is set, the zip is signed with Sparkle's sign_update and, for non-pre-release
# versions, added to site/appcast.xml, committed to main and deployed to
# GitHub Pages (https://kkratterf.github.io/f4/appcast.xml). Without the secret
# these steps are skipped with a warning and the app simply does not update
# itself.
#   SPARKLE_ED_PRIVATE_KEY   private EdDSA key (Sparkle's `generate_keys -x`);
#                            its public half is SUPublicEDKey in Resources/Info.plist
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run: build everything, publish nothing (files go to the workflow artifacts)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  release:
    name: ${{ inputs.dry_run && 'Dry run (publishes nothing)' || 'Build, tag and publish' }}
    runs-on: macos-15
    permissions:
      contents: write
      # To start the Pages deploy after the appcast commit (pushes made with
      # GITHUB_TOKEN do not trigger workflows on their own).
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version format
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a SemVer version (expected X.Y.Z)"
            exit 1
          fi

      - name: Check the version matches Info.plist
        run: |
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [ "$plist_version" != "$VERSION" ]; then
            echo "::error::Resources/Info.plist has version $plist_version, but the release asks for $VERSION. Merge a version bump first."
            exit 1
          fi

      - name: Check the tag does not exist yet
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Build F4.app
        run: scripts/build-app.sh release

      - name: Build the DMG
        run: |
          scripts/build-dmg.sh
          # Same file under a name that never changes, so the website's Download
          # button can link releases/latest/download/F4.dmg and always get the
          # newest version.
          cp "dist/F4-$VERSION.dmg" dist/F4.dmg

      - name: Checksums
        run: |
          cd dist
          test -f "F4-$VERSION.zip"
          test -f "F4-$VERSION.dmg"
          shasum -a 256 "F4-$VERSION.zip" "F4-$VERSION.dmg" F4.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign the update for Sparkle
        id: sparkle
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set: the update is not signed and the appcast is not updated"
            exit 0
          fi
          # Sparkle's tools come with the SwiftPM artifact; download them if
          # this SwiftPM version did not keep them.
          sign_update=$(find .build/artifacts -type f -name sign_update -perm -u+x 2>/dev/null | head -n 1)
          if [ -z "$sign_update" ]; then
            sparkle_version=$(python3 -c "import json; pins = json.load(open('Package.resolved'))['pins']; print([p['state']['version'] for p in pins if p['identity'] == 'sparkle'][0])")
            curl -fsSL -o "$RUNNER_TEMP/sparkle.zip" \
              "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-for-Swift-Package-Manager.zip"
            unzip -q -o "$RUNNER_TEMP/sparkle.zip" 'bin/*' -d "$RUNNER_TEMP/sparkle"
            sign_update="$RUNNER_TEMP/sparkle/bin/sign_update"
          fi
          zip_signature=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - "dist/F4-$VERSION.zip")
          echo "zip: $zip_signature"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "zip_signature=$zip_signature" >> "$GITHUB_OUTPUT"

      - name: Prepare the appcast and cask updates
        id: updates
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          SPARKLE_ENABLED: ${{ steps.sparkle.outputs.enabled }}
          ZIP_SIGNATURE: ${{ steps.sparkle.outputs.zip_signature }}
        run: |
          # Both edits are committed on a local branch from the latest main;
          # "Push the updates to main" publishes it, except in a dry run.
          out="$RUNNER_TEMP/release-out"
          mkdir -p "$out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B release-updates origin/main
          base=$(git rev-parse HEAD)
          appcast=false
          if [ "$PRERELEASE" = "true" ]; then
            echo "::notice::Pre-release: the appcast and the Homebrew cask keep the previous version"
          else
            if [ "$SPARKLE_ENABLED" = "true" ]; then
              python3 scripts/update-appcast.py \
                --appcast site/appcast.xml \
                --version "$VERSION" \
                --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/F4-$VERSION.zip" \
                --signature "$ZIP_SIGNATURE"
              git add site/appcast.xml
              git commit -m "chore(release): add F4 $VERSION to the appcast"
              git diff HEAD~1 HEAD -- site/appcast.xml > "$out/appcast.diff"
              cp site/appcast.xml "$out/appcast.xml"
              appcast=true
            else
              echo "::notice::No Sparkle key: the appcast is not updated"
            fi
            sha=$(shasum -a 256 "dist/F4-$VERSION.dmg" | cut -d' ' -f1)
            sed -i '' -E \
              -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
              -e "s/^  sha256 .*$/  sha256 \"$sha\"/" \
              Casks/f4.rb
            git add Casks/f4.rb
            if git diff --cached --quiet; then
              echo "::notice::The Homebrew cask is already at $VERSION"
            else
              git commit -m "chore(release): bump the Homebrew cask to $VERSION"
              git diff HEAD~1 HEAD -- Casks/f4.rb > "$out/cask.diff"
            fi
            cp Casks/f4.rb "$out/f4.rb"
          fi
          commits=$(git rev-list --count "$base"..HEAD)
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          echo "appcast=$appcast" >> "$GITHUB_OUTPUT"
          git log --oneline "$base"..HEAD

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
          if [ -n "$previous" ]; then args+=(-f previous_tag_name="$previous"); fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > dist/notes.md
          {
            echo
            echo "## Install"
            echo
            echo "Download \`F4-$VERSION.dmg\`, open it and drag **F4** onto Applications."
            echo "F4 is not notarized yet: the first time, open it, then go to **System Settings → Privacy & Security** and click **Open Anyway**."
            echo "Or, in Terminal: \`xattr -dr com.apple.quarantine /Applications/F4.app\`."
          } >> dist/notes.md
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the dry run
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: f4-${{ inputs.version }}-dry-run
          path: |
            dist/F4-${{ inputs.version }}.zip
            dist/F4-${{ inputs.version }}.dmg
            dist/SHA256SUMS.txt
            dist/notes.md
            ${{ runner.temp }}/release-out/

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file dist/notes.md \
            ${flags[@]+"${flags[@]}"} \
            "dist/F4-$VERSION.zip" "dist/F4-$VERSION.dmg" dist/F4.dmg dist/SHA256SUMS.txt

      # After the release, so the appcast and the cask never point at missing assets.
      - name: Push the updates to main
        if: ${{ !inputs.dry_run && steps.updates.outputs.commits != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APPCAST: ${{ steps.updates.outputs.appcast }}
        run: |
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::Could not push the appcast and cask updates to main"; exit 1; fi
            sleep $((attempt * 5))
            git fetch origin main
            git rebase origin/main
          done
          if [ "$APPCAST" = "true" ] && ! gh workflow run pages.yml --ref main; then
            echo "::warning::Could not start the Pages deploy: run the Pages workflow by hand to publish appcast.xml"
          fi
