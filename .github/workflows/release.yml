name: Release

# Automatic: merging a `chore(release): vX.Y.Z` PR that changes
# CFBundleShortVersionString in Resources/Info.plist publishes vX.Y.Z as soon
# as it lands on main. Pushes that leave the version alone, or whose version is
# already tagged, release nothing. A version with a suffix (0.3.0-beta.1) is
# published as a pre-release.
#
# By hand (workflow_dispatch): the same pipeline for the version in Info.plist,
# mainly for dry runs or to retry a failed release.
#
# Tests, builds F4.app (Developer ID signed and notarized when the secrets
# below are set, ad-hoc signed otherwise), and publishes F4-<version>.zip,
# F4-<version>.dmg, F4.dmg (the same DMG under a fixed name, for the website's
# Download button) and SHA256SUMS.txt on a new vX.Y.Z tag, with release notes
# grouped by PR label (.github/release.yml), then (for stable releases) adds
# the update to the appcast and bumps Casks/f4.rb on main.
#
# Dry run (dry_run: true): runs the whole pipeline but creates no tag or
# release and pushes nothing to main; the zip, the DMG, the checksums, the
# notes, appcast.xml, the cask and their diffs are uploaded as the
# "f4-<version>-dry-run" artifact and the notes are shown in the job summary.
#
# Auto-update with Sparkle. When the SPARKLE_ED_PRIVATE_KEY secret is set, the
# zip is signed with Sparkle's sign_update and, for non-pre-release versions,
# added to site/appcast.xml, committed to main and deployed to GitHub Pages
# (https://f4.kkratter.com/appcast.xml). Without the secret these steps
# are skipped with a warning and the app simply does not update itself.
#   SPARKLE_ED_PRIVATE_KEY   private EdDSA key (Sparkle's `generate_keys -x`);
#                            its public half is SUPublicEDKey in Resources/Info.plist
#
# Developer ID signing and notarization. When the certificate secrets are set,
# F4.app, its Sparkle helpers and the DMG are signed with the Developer ID
# Application identity (hardened runtime, secure timestamp); when the notary
# secrets are set too, the app and the DMG are notarized by Apple and the
# tickets stapled (scripts/notarize.sh), so Gatekeeper opens the download with
# no "Open Anyway". Without them the build stays ad-hoc signed, with a warning.
#   DEVELOPER_ID_P12_BASE64      the "Developer ID Application" certificate and
#                                its private key, exported as .p12, in base64
#   DEVELOPER_ID_P12_PASSWORD    the password of that .p12
#   APPLE_ID                     the Apple Account of the developer team
#   APPLE_APP_SPECIFIC_PASSWORD  an app-specific password of that account
#   APPLE_TEAM_ID                the 10-character team ID
on:
  push:
    branches: [main]
    paths:
      - Resources/Info.plist
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the release as a pre-release (versions with a suffix always are)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run: build everything, publish nothing (files go to the workflow artifacts)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version and look for its tag
        id: decide
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          version=$(python3 -c "import plistlib; print(plistlib.load(open('Resources/Info.plist', 'rb'))['CFBundleShortVersionString'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' in Resources/Info.plist is not a SemVer version (expected X.Y.Z)"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]] || [ "$PRERELEASE_INPUT" = "true" ]; then prerelease=true; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null && [ "$DRY_RUN" != "true" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released: nothing to do"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v$version (pre-release: $prerelease, dry run: ${DRY_RUN:-false})"
          fi

  release:
    name: ${{ inputs.dry_run && 'Dry run (publishes nothing)' || 'Build, tag and publish' }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-15
    permissions:
      contents: write
      # To start the Pages deploy after the appcast commit (pushes made with
      # GITHUB_TOKEN do not trigger workflows on their own).
      actions: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag does not exist yet
        if: ${{ !inputs.dry_run }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Import the Developer ID certificate
        id: signing
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEVELOPER_ID_P12_BASE64 is not set: F4 is ad-hoc signed and not notarized, so macOS asks users to Open Anyway"
            exit 0
          fi
          # A throwaway keychain that only this job uses, deleted at the end.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Lets codesign use the key without a prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::No \"Developer ID Application\" identity in DEVELOPER_ID_P12_BASE64 (export the certificate together with its private key)"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          if [ -n "$APPLE_TEAM_ID" ] && [[ "$identity" != *"($APPLE_TEAM_ID)" ]]; then
            echo "::error::The certificate ($identity) does not belong to APPLE_TEAM_ID $APPLE_TEAM_ID"
            exit 1
          fi
          echo "::notice::Signing with $identity"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD or APPLE_TEAM_ID is not set: F4 is signed but not notarized"
          fi

      - name: Build F4.app
        run: scripts/build-app.sh release

      - name: Notarize F4.app
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/notarize.sh dist/F4.app
          # The zip is Sparkle's update and the manual download: zip the app
          # again so it carries the stapled ticket.
          (cd dist && rm -f "F4-$VERSION.zip" && ditto -c -k --keepParent F4.app "F4-$VERSION.zip")

      - name: Build the DMG
        env:
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/build-dmg.sh
          if [ "$NOTARIZE" = "true" ]; then
            scripts/notarize.sh "dist/F4-$VERSION.dmg"
          fi
          # Same file under a name that never changes, so the website's Download
          # button can link releases/latest/download/F4.dmg and always get the
          # newest version.
          cp "dist/F4-$VERSION.dmg" dist/F4.dmg

      - name: Checksums
        run: |
          cd dist
          test -f "F4-$VERSION.zip"
          test -f "F4-$VERSION.dmg"
          shasum -a 256 "F4-$VERSION.zip" "F4-$VERSION.dmg" F4.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign the update for Sparkle
        id: sparkle
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set: the update is not signed and the appcast is not updated"
            exit 0
          fi
          # Sparkle's tools come with the SwiftPM artifact; download them if
          # this SwiftPM version did not keep them.
          sign_update=$(find .build/artifacts -type f -name sign_update -perm -u+x 2>/dev/null | head -n 1)
          if [ -z "$sign_update" ]; then
            sparkle_version=$(python3 -c "import json; pins = json.load(open('Package.resolved'))['pins']; print([p['state']['version'] for p in pins if p['identity'] == 'sparkle'][0])")
            curl -fsSL -o "$RUNNER_TEMP/sparkle.zip" \
              "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-for-Swift-Package-Manager.zip"
            unzip -q -o "$RUNNER_TEMP/sparkle.zip" 'bin/*' -d "$RUNNER_TEMP/sparkle"
            sign_update="$RUNNER_TEMP/sparkle/bin/sign_update"
          fi
          zip_signature=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - "dist/F4-$VERSION.zip")
          echo "zip: $zip_signature"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "zip_signature=$zip_signature" >> "$GITHUB_OUTPUT"

      - name: Prepare the appcast and cask updates
        id: updates
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          SPARKLE_ENABLED: ${{ steps.sparkle.outputs.enabled }}
          ZIP_SIGNATURE: ${{ steps.sparkle.outputs.zip_signature }}
        run: |
          # Both edits are committed on a local branch from the latest main;
          # "Push the updates to main" publishes it, except in a dry run.
          out="$RUNNER_TEMP/release-out"
          mkdir -p "$out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B release-updates origin/main
          base=$(git rev-parse HEAD)
          appcast=false
          if [ "$PRERELEASE" = "true" ]; then
            echo "::notice::Pre-release: the appcast and the Homebrew cask keep the previous version"
          else
            if [ "$SPARKLE_ENABLED" = "true" ]; then
              python3 scripts/update-appcast.py \
                --appcast site/appcast.xml \
                --version "$VERSION" \
                --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/F4-$VERSION.zip" \
                --signature "$ZIP_SIGNATURE"
              git add site/appcast.xml
              git commit -m "chore(release): add F4 $VERSION to the appcast"
              git diff HEAD~1 HEAD -- site/appcast.xml > "$out/appcast.diff"
              cp site/appcast.xml "$out/appcast.xml"
              appcast=true
            else
              echo "::notice::No Sparkle key: the appcast is not updated"
            fi
            sha=$(shasum -a 256 "dist/F4-$VERSION.dmg" | cut -d' ' -f1)
            sed -i '' -E \
              -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
              -e "s/^  sha256 .*$/  sha256 \"$sha\"/" \
              Casks/f4.rb
            git add Casks/f4.rb
            if git diff --cached --quiet; then
              echo "::notice::The Homebrew cask is already at $VERSION"
            else
              git commit -m "chore(release): bump the Homebrew cask to $VERSION"
              git diff HEAD~1 HEAD -- Casks/f4.rb > "$out/cask.diff"
            fi
            cp Casks/f4.rb "$out/f4.rb"
          fi
          commits=$(git rev-list --count "$base"..HEAD)
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          echo "appcast=$appcast" >> "$GITHUB_OUTPUT"
          git log --oneline "$base"..HEAD

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ steps.signing.outputs.notarize }}
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
          if [ -n "$previous" ]; then args+=(-f previous_tag_name="$previous"); fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > dist/notes.md
          {
            echo
            echo "## Install"
            echo
            echo "Download \`F4-$VERSION.dmg\`, open it and drag **F4** onto Applications."
            if [ "$NOTARIZED" = "true" ]; then
              echo "F4 is signed with a Developer ID and notarized by Apple, so it opens like any other app."
            else
              echo "F4 is not notarized yet: the first time, open it, then go to **System Settings → Privacy & Security** and click **Open Anyway**."
              echo "Or, in Terminal: \`xattr -dr com.apple.quarantine /Applications/F4.app\`."
            fi
          } >> dist/notes.md
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the dry run
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: f4-${{ needs.version.outputs.version }}-dry-run
          path: |
            dist/F4-${{ needs.version.outputs.version }}.zip
            dist/F4-${{ needs.version.outputs.version }}.dmg
            dist/SHA256SUMS.txt
            dist/notes.md
            ${{ runner.temp }}/release-out/

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file dist/notes.md \
            ${flags[@]+"${flags[@]}"} \
            "dist/F4-$VERSION.zip" "dist/F4-$VERSION.dmg" dist/F4.dmg dist/SHA256SUMS.txt

      # After the release, so the appcast and the cask never point at missing assets.
      - name: Push the updates to main
        if: ${{ !inputs.dry_run && steps.updates.outputs.commits != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APPCAST: ${{ steps.updates.outputs.appcast }}
        run: |
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::Could not push the appcast and cask updates to main"; exit 1; fi
            sleep $((attempt * 5))
            git fetch origin main
            git rebase origin/main
          done
          if [ "$APPCAST" = "true" ] && ! gh workflow run pages.yml --ref main; then
            echo "::warning::Could not start the Pages deploy: run the Pages workflow by hand to publish appcast.xml"
          fi

      - name: Delete the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true
