name: Hero video

# Records the website's hero clip with the real app on a macOS runner
# (scripts/record-hero.sh), in Chrome and in Safari, and pushes each raw take
# to the hero-video/<ref>-<browser> branch, where scripts/make-hero-video.sh can fetch it and cut the clip
# (artifacts need a login to download). Runs by hand, and on pull requests
# that change the recording.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/record-hero.sh
      - scripts/hero/**
      - .github/workflows/hero-video.yml

permissions:
  contents: read

concurrency:
  group: hero-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record the hero clip (${{ matrix.browser }})
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, safari]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the app bundle
        run: scripts/build-app.sh release

      - name: The animated sticker
        # The maintainer's goat (site/media/stickers/capretta.webp) as a GIF,
        # the format F4 plays in the panel. Made here, never committed.
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageSequence
          im = Image.open("site/media/stickers/capretta.webp")
          frames, durations = [], []
          for f in ImageSequence.Iterator(im):
              frames.append(f.convert("RGBA"))
              durations.append(f.info.get("duration", 80))
          frames[0].save("dist/capretta.gif", save_all=True, append_images=frames[1:],
                         duration=durations, loop=0, disposal=2)
          PY

      - name: Record
        run: |
          system_profiler SPDisplaysDataType | sed -n '/Displays:/,$p'
          BROWSER=${{ matrix.browser }} QUERY="?debug" ANIMATED="$PWD/dist/capretta.gif" scripts/record-hero.sh

      - name: Push the take to its branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: hero-video/${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ matrix.browser }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd dist/hero
          git init -q
          git checkout -q -b "$BRANCH"
          git add .
          git -c user.name="F4 CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Hero take for ${SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          echo "::notice::Hero take: https://github.com/${GITHUB_REPOSITORY}/tree/${BRANCH}"
