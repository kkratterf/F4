# Groups the auto-generated release notes by PR label.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: App
      labels:
        - app
    - title: Libreria di meme
      labels:
        - library
    - title: Integrazioni
      labels:
        - ecosystem
    - title: Correzioni
      labels:
        - bug
    - title: CI e strumenti
      labels:
        - ci
    - title: Altro
      labels:
        - "*"
