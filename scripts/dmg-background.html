<!doctype html>
<!--
  The background of the F4 installer window (dist/F4-x.y.z.dmg), built like
  the website hero so the two match: the same grainient, the same dimming,
  Inter, the glass panel. scripts/render-dmg-background.mjs renders it to
  background.png (@1x) and background@2x.png; build-dmg.sh merges them.

  The page is 640 x 448 pt: Finder's window is set to that height in
  build-dmg.sh, and its title bar may take the bottom 28 pt, so nothing that
  matters sits below 420. The icon centres (170, 244) and (470, 244) must
  match APP_POS and APPS_POS in build-dmg.sh. Finder draws the icon names
  black or white with the system appearance, so they sit on the glass panel,
  a mid tone where both read.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=block">
  <style>
    :root {
      --bg: #0a0908;
      --muted: #9c948b;
      --yellow: #ffc43d;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
    }

    .window {
      position: relative;
      width: 640px;
      height: 448px;
      overflow: hidden;
      font-family: "Inter", -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* The hero background of site/styles.css: a CSS glow first, then the
       grainient canvas over it, blurred. Without WebGL the glow shows. */
    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 45% at 30% 10%, rgba(255, 196, 61, 0.35), transparent 70%),
        radial-gradient(ellipse 50% 40% at 75% 20%, rgba(255, 106, 26, 0.3), transparent 70%),
        var(--bg);
    }

    .hero-bg canvas {
      position: absolute;
      inset: -40px;
      width: calc(100% + 80px);
      height: calc(100% + 80px);
      opacity: 0;
      filter: blur(22px) saturate(1.1);
    }

    .hero-bg canvas.on {
      opacity: 0.8;
    }

    /* Dim the gradient under the title and towards the bottom. */
    .hero-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 40% at 50% 16%, rgba(10, 9, 8, 0.6), transparent 80%),
        linear-gradient(180deg, rgba(10, 9, 8, 0.25) 0%, rgba(10, 9, 8, 0.35) 45%, rgba(10, 9, 8, 0.8) 94%);
    }

    h1 {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      margin: 0;
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.035em;
      background: linear-gradient(180deg, #fff 30%, #b9b0a6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      position: absolute;
      top: 84px;
      left: 0;
      right: 0;
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
    }

    /* The F4 key, as on the site. */
    kbd {
      display: inline-block;
      margin: 0 2px;
      padding: 1px 6px;
      border-radius: 5px;
      background: linear-gradient(180deg, #ffe27e, var(--yellow));
      box-shadow: 0 1px 0 #c77800;
      color: #241809;
      font: 700 11px/1.5 "Inter", sans-serif;
      letter-spacing: -0.01em;
    }

    /* The glass panel the two icons sit on. */
    .panel {
      position: absolute;
      left: 48px;
      right: 48px;
      top: 132px;
      height: 236px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 236, 214, 0.26), rgba(255, 236, 214, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 24px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(30px) saturate(0.9);
    }

    /* The key's glow behind the app icon. */
    .glow {
      position: absolute;
      left: 92px;
      top: 166px;
      width: 156px;
      height: 156px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 196, 61, 0.45), transparent 70%);
    }

    .arrow {
      position: absolute;
      left: 278px;
      top: 222px;
      width: 84px;
      height: 44px;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="hero-bg"><canvas data-grainient data-colors="#ffa726,#ff4d1f,#1c0805"></canvas></div>
    <h1>Drag F4 to Applications</h1>
    <p>Then press <kbd>F4</kbd> anywhere</p>
    <div class="panel"></div>
    <div class="glow"></div>
    <svg class="arrow" viewBox="0 0 84 44" aria-hidden="true">
      <defs>
        <filter id="lit" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffc43d"/>
        </filter>
      </defs>
      <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 10 L26 22 L14 34" stroke="#fff" stroke-opacity="0.3"/>
        <path d="M36 10 L48 22 L36 34" stroke="#fff" stroke-opacity="0.55"/>
        <path d="M58 10 L70 22 L58 34" stroke="#ffc43d" filter="url(#lit)"/>
      </g>
    </svg>
  </div>
  <!-- The site's own shader. The renderer asks for reduced motion, so it
       draws a single frame and stops. -->
  <script src="../site/grainient.js"></script>
</body>
</html>
